name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Actions タブから手動実行できるようにする
  workflow_dispatch:

# GITHUB_TOKEN に Pages へのデプロイ権限を与える
permissions:
  contents: read
  pages: write
  id-token: write

# 同時デプロイを防ぐ。進行中の実行はキャンセルせず完了させる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      # 壊れた状態を公開しないよう、ビルド前に検証する
      - run: npm run lint
      - run: npm run test

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
